<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Brottarklocka – publikskärm</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
    .screen{height:100vh;padding:2vh 2vw;display:flex;flex-direction:column}
    .head{display:flex;justify-content:space-between;font-size:4vh;font-weight:900}
    .red{color:#ff2b2b}.blue{color:#1f6fff}.yellow{color:#ffd900}
    .match-number{text-align:center;margin-top:1vh}
    .mn-label{font-size:2.6vh;font-weight:900;margin-bottom:.6vh}
    .mn-box{display:inline-flex;background:#fff;color:#000;border-radius:1vh;padding:1vh 2vw;min-width:12vw;justify-content:center}
    .mn-digits{font-family:"Courier New",monospace;font-size:8vh;font-weight:900;line-height:1}
    .main{flex:1;display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:2vw;align-items:center}
    .score{font-family:"Courier New",monospace;font-size:28vh;line-height:1;font-weight:900;text-align:center}
    .clock{text-align:center;font-family:"Courier New",monospace;font-weight:900;font-size:18vh;line-height:1;white-space:nowrap}
    .status{text-align:center;font-size:5vh;font-weight:900;margin-top:2vh}
    .period{text-align:center;font-size:4vh;font-weight:900;margin-top:1vh}
    .wrestlers{display:grid;grid-template-columns:1fr 1fr;gap:15vw;padding:1vh 8vw 0}
    .wrestler{text-align:center}.wname{font-size:4vh;font-weight:900}.wclub{font-size:2.6vh;font-weight:700;color:#ddd;margin-top:.5vh}
    .tournament{text-align:center;color:#ccc;font-size:2.4vh;font-weight:700;margin-top:.4vh}
    .warnings{display:grid;grid-template-columns:1fr 1fr;gap:15vw;padding:0 8vw 3vh}
    .warning{text-align:center}
    .warning-title{font-size:3vh;font-weight:900;margin-bottom:1vh}
    .dots{display:flex;gap:2vw;justify-content:center}
    .dot{width:5vh;height:5vh;border-radius:50%;border:.6vh solid currentColor}
    .dot.on{background:currentColor}
  </style>
</head>
<body>
  <div class="screen">
    <div class="head"><span class="red">RÖD</span><span id="length">4 MIN MATCH</span><span class="blue">BLÅ</span></div>
    <div id="tournamentName" class="tournament"></div>
    <div class="match-number">
      <div class="mn-label">MATCHNUMMER</div>
      <div class="mn-box"><div id="matchNumber" class="mn-digits">1</div></div>
    </div>
    <div class="main">
      <div id="redScore" class="score red">0</div>
      <div>
        <div id="clock" class="clock yellow">00:00</div>
        <div id="status" class="status">KLAR</div>
        <div id="period" class="period">PERIOD 1 / 2</div>
      </div>
      <div id="blueScore" class="score blue">0</div>
    </div>
    <div class="wrestlers">
      <div class="wrestler red"><div id="redName" class="wname">—</div><div id="redClub" class="wclub">—</div></div>
      <div class="wrestler blue"><div id="blueName" class="wname">—</div><div id="blueClub" class="wclub">—</div></div>
    </div>
    <div class="warnings">
      <div class="warning red">
        <div class="warning-title">VARNINGAR</div>
        <div id="redWarnings" class="dots"></div>
      </div>
      <div class="warning blue">
        <div class="warning-title">VARNINGAR</div>
        <div id="blueWarnings" class="dots"></div>
      </div>
    </div>
  </div>
<script>
const $=id=>document.getElementById(id);
function fmt(sec){const s=Math.max(0,Math.floor(sec||0));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function dots(el,count){el.innerHTML="";for(let i=0;i<3;i++){const d=document.createElement("div");d.className="dot"+(i<count?" on":"");el.appendChild(d)}}
function render(s){
  if(!s)return;
  $("length").textContent=(s.matchLength===6?"6":"4")+" MIN MATCH";
  $("matchNumber").textContent=s.matchNumber||"1";
  $("tournamentName").textContent=s.tournamentName||"";
  $("redName").textContent=s.redName||"—"; $("redClub").textContent=s.redClub||"—";
  $("blueName").textContent=s.blueName||"—"; $("blueClub").textContent=s.blueClub||"—";
  $("redScore").textContent=s.redScore??0; $("blueScore").textContent=s.blueScore??0;
  $("clock").textContent=fmt(s.elapsed);
  $("status").textContent=s.status||"KLAR";
  $("status").style.color=s.finished?"#ffd900":s.running?"#20c75a":(s.status==="PERIODPAUS"?"#ffd900":"#fff");
  $("period").textContent=`PERIOD ${s.period||1} / 2`;
  dots($("redWarnings"),s.redWarnings||0); dots($("blueWarnings"),s.blueWarnings||0);
}
if("BroadcastChannel" in window){
  const ch=new BroadcastChannel("brottarklocka");
  ch.onmessage=e=>render(e.data);
}
window.addEventListener("storage",e=>{if(e.key==="brottarklocka_state")try{render(JSON.parse(e.newValue))}catch(_){}});
setInterval(()=>{try{render(JSON.parse(localStorage.getItem("brottarklocka_state")))}catch(_){}},500);
try{render(JSON.parse(localStorage.getItem("brottarklocka_state")))}catch(_){}
</script>
</body>
</html>
